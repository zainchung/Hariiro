# Anna Glass V2 - Stage 2C Native Accent Test, no BOM.
script = main.txt
playlist.header = 1
playlist.row_format = $if(%tracknumber%,$ifgreater($num(%discnumber%,1),1,$num(%discnumber%,1)-$num(%tracknumber%,2),$num(%tracknumber%,2)). ,)[%title%]
color.background = 24 25 30
color.text = 225 228 235
color.text_secondary = 160 165 175
color.text_dim = 120 125 135
color.separator = 82 84 94
color.hover = 50 52 62
color.seekbar.background = 52 55 64
color.volume.background = 52 55 64

# Native panels (NATIVE playlist). Round 22: Panels UI has no variable for color.*, so these
# are neutral and suit every accent colour; the highlight is not set, so selected/playing rows
# use the accent (theme.accent_pvar below), which follows the chosen colour live.
color.playlist.text = 236 237 244
color.playlist.text_secondary = 200 203 216
color.playlist.text_dim = 164 168 184
color.playlist.separator = 112 118 134
color.playlist.row_text = 226 231 242
color.playlist.row_text_selected = 255 255 255
color.playlist.hover = 72 76 92

# Panels UI native-panel wallpaper mapping (relative to images directory).
background.image_pvar = anna.glass.v2.wallpaper
pvar.once.anna.glass.v2.wallpaper = wallpapers/Anna_GLASS_UI_2560x1440.png
background.alpha = 255
background.top = 0

# Stage 2B: transparent JS Panel used for left navigation only.
panel.Playlists.script = js/playlist_browser.js
panel.Playlists.transparent = 1
# Round 15: the three OLE drop targets (Playlists, GlassPlaylist, AnnaQueue) are
# real child windows. With windowless = 1, Panels UI sent them on_drag_leave
# instead of on_drag_drop and foobar2000 inserted into the active playlist.
# Child windows get physical pixels; js/anna_dpi.js scales their drawing.
panel.Playlists.windowless = 0
# Use the built-in foobar2000 Album Art panel: handles m4a MP4 covr tags through native art manager.
# Single flow-layout metadata panel beside the artwork; all fields share one coordinate system.
panel.NowDetails.script = js/anna_now_details.js
panel.NowDetails.transparent = 1
panel.NowDetails.windowless = 1

# AnnaLyrics: frameless transparent local files/tags (read-only ESLyric saves).
panel.AnnaLyrics.script = js/anna_lyrics.js
panel.AnnaLyrics.transparent = 1
# Round 21: a child window. Its karaoke repaints (up to 20 a second) as a windowless
# panel made Panels UI redraw the whole layout and every JS panel each time.
panel.AnnaLyrics.windowless = 0
# Optional real ESLyric desktop-lyrics control. Missing component is reported,
# never simulated by an independent pvar toggle.
panel.DesktopLyrics.script = js/anna_desktop_lyrics.js
panel.DesktopLyrics.transparent = 1
panel.DesktopLyrics.windowless = 1
# Stage 2E: narrow native spectrum waveform and soft rose accent.
# The native spectrum uses 1-pixel columns in standard mode; thick bars are not used.
theme.accent_pvar = anna.glass.v2.accent
pvar.once.anna.glass.v2.accent = 249-165-210
pvar.once.spectrum.mode = standard

# Stage 2G: functional native quick search and transparent functional footer sliders.
# A single focusable Glass search receives Unicode WM_CHAR input, including
# committed IME text, with a blinking caret and clipboard editing.
panel.GlassSearch.script = js/anna_search.js
panel.GlassSearch.transparent = 1
panel.GlassSearch.windowless = 0
panel.NavTabs.script = js/anna_nav_tabs.js
panel.NavTabs.transparent = 1
panel.NavTabs.windowless = 1
panel.CaptionStrip.script = js/anna_caption_strip.js
panel.CaptionStrip.transparent = 1
panel.CaptionStrip.windowless = 1
panel.TopChrome.script = js/anna_top_chrome.js
panel.TopChrome.transparent = 1
panel.TopChrome.windowless = 1
panel.FooterQueueToggle.script = js/anna_queue_toggle.js
panel.FooterQueueToggle.transparent = 1
panel.FooterQueueToggle.windowless = 1
panel.FooterTransport.script = js/anna_transport.js
panel.FooterTransport.transparent = 1
panel.FooterTransport.windowless = 1
panel.FooterSeek.script = js/anna_footer_slider.js
panel.FooterSeek.transparent = 1
# Round 21: a child window for the same reason (the butterfly's breathing glow).
panel.FooterSeek.windowless = 0
panel.FooterVolume.script = js/anna_footer_slider.js
panel.FooterVolume.transparent = 1
panel.FooterVolume.windowless = 1

# Stage 3A: opt-in preview only. Keep original native playlist until VIEW is clicked.
pvar.once.anna.playlist.experimental = 1
panel.GlassPlaylist.script = js/anna_glass_playlist.js
panel.GlassPlaylist.transparent = 1
panel.GlassPlaylist.windowless = 0

# Real child-window JS panels receive their own keyboard focus and OLE drag/drop.
panel.AnnaQueue.script = js/anna_queue.js
panel.AnnaQueue.transparent = 1
panel.AnnaQueue.windowless = 0
pvar.once.anna.queue.open = 0
pvar.once.anna.nav.mode = library
pvar.once.anna.favorite.current = 0

# Stage 4: reference layout lives in main.txt; no 16:9 sizing override is enabled.
# The original native playlist retains wheel/keyboard input. Its narrow
# narrow top-level child JS panel calls EnsurePlaylistItemVisible on thumb drag.
panel.NativeScroll.script = js/anna_native_scroll.js
panel.NativeScroll.transparent = 1
panel.NativeScroll.windowless = 0

# Stage 3I.4 — immersive system chrome defaults (can always be restored via SYS / MB buttons).
# First skin selection may retain an already-present menu until MB is clicked or foobar2000 restarts.
pvar.once.anna.chrome.hidden = 1
pvar.once.menubar = 0


# State-specific switches render the correct position even when pvar/JS variable notifications differ.
panel.SwitchGlass.script = js/anna_mode_switch.js
panel.SwitchGlass.transparent = 1
panel.SwitchGlass.windowless = 1
panel.SwitchNative.script = js/anna_mode_switch.js
panel.SwitchNative.transparent = 1
panel.SwitchNative.windowless = 1

# Language of the skin-owned menus. Use the Anna Glass settings menu to change.
pvar.once.anna.language = auto

# Saved accent colour: a folder in images/controls (Round 22; the background artwork is not recolored).
pvar.once.anna.theme.hue = pink
