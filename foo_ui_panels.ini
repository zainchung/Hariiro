# Anna Glass V2 - Stage 2C Native Accent Test, no BOM.
script = main.txt
playlist.header = 1
playlist.row_format = [$num(%tracknumber%,2). ][%title%]
color.background = 24 25 30
color.text = 225 228 235
color.text_secondary = 160 165 175
color.text_dim = 120 125 135
color.separator = 92 72 82
color.hover = 52 45 58
color.highlight = 205 145 92
color.seekbar.background = 52 55 64
color.volume.background = 52 55 64

# Stage 2C: supported native-playlist colour roles only. These strengthen the
# group/column borders and make playing/selected rows visibly warm-gold without
# replacing the working native playlist interaction layer.
color.playlist.text = 238 226 214
color.playlist.text_secondary = 202 184 178
color.playlist.text_dim = 164 151 158
color.playlist.separator = 152 104 92
color.playlist.highlight = 205 145 92
color.playlist.row_text = 226 231 242
color.playlist.row_text_selected = 255 249 225
color.playlist.hover = 76 60 70

# Panels UI native-panel wallpaper mapping (relative to images directory).
background.image_pvar = anna.glass.v2.wallpaper
pvar.once.anna.glass.v2.wallpaper = wallpaper.jpg
background.alpha = 255
background.top = 0

# Stage 2B: transparent JS Panel used for left navigation only.
panel.Playlists.script = js/playlist_browser.js
panel.Playlists.transparent = 1
panel.Playlists.windowless = 1

# Anna Glass V2 / Stage 2D: glass lyrics + native fallback
panel.AnnaLyrics.script = js/anna_lyrics.js
panel.AnnaLyrics.transparent = 1
panel.AnnaLyrics.windowless = 1
pvar.once.anna.lyrics.native = 0
# Stage 2E: right column uses the stock transparent Spectrum panel.

# Stage 2G: functional native quick search and transparent functional footer sliders.
color.quick_search.background = 13 24 46
color.quick_search.frame = 154 125 150
panel.FooterSeek.script = js/anna_footer_slider.js
panel.FooterSeek.transparent = 1
panel.FooterSeek.windowless = 1
panel.FooterVolume.script = js/anna_footer_slider.js
panel.FooterVolume.transparent = 1
panel.FooterVolume.windowless = 1

# Stage 3A: opt-in preview only. Keep original native playlist until VIEW is clicked.
pvar.once.anna.playlist.experimental = 0
panel.GlassPlaylist.script = js/anna_glass_playlist.js
panel.GlassPlaylist.transparent = 1
panel.GlassPlaylist.windowless = 1

# Stage 3E: 16:9 is the only wallpaper composition.
# This is the skin's CLIENT size, not the Windows outer-frame size.
# Panels UI applies this when selecting the skin or changing this setting.
# It does NOT by itself lock interactive window resizing.
window.size = 1280 720
# Stage 3I.2: native Spectrum is 60fps when ON; default OFF for performance testing.
# This affects only the visualizer, never audio playback. Click VIS: OFF/ON in the top-right panel header.
pvar.once.anna.spectrum.low_power = 1
command.Reset 16:9 (1280x720) = WINDOWSIZE:1280:720

# Stage 3F: layout-only changes. Aspect-constrained drag remains a separate future plugin feature.

# Stage 3I.4 — immersive system chrome defaults (can always be restored via SYS / MB buttons).
# First skin selection may retain an already-present menu until MB is clicked or foobar2000 restarts.
pvar.once.anna.chrome.hidden = 1
pvar.once.menubar = 0
