name: Bug report
description: Something in Hariiro does not work as described in Hariiro-README.txt
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Questions and ideas are welcome in Discussions instead.
        Please do not attach your playlists or music files.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select ...
        2. Drag ... onto ...
        3. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Hariiro, foobar2000, Panels UI (reborn), foo_js_panel (and ESLyric, if used)
      placeholder: Hariiro 1.0.0, foobar2000 2.26.3, Panels UI 1.27.1, foo_js_panel 1.9.2
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: List mode
      options: [GLASS, NATIVE, Both]
  - type: input
    id: display
    attributes:
      label: Windows version and display scaling
      placeholder: Windows 11, 2560x1440 at 150 %
  - type: textarea
    id: log
    attributes:
      label: Errors from foo_js_panel.log (optional)
      description: The file is in your foobar2000 profile folder. Remove personal paths if you like.
      render: text
